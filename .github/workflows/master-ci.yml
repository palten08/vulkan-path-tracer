name: Build and Release

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

env:
  BUILD_TYPE: ${{ github.ref == 'refs/heads/master' && 'Release' || 'Debug' }}

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Read version and decide whether to release
      id: version
      shell: bash
      run: |
        VERSION=$(cat VERSION | tr -d '[:space:]')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]]; then
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists, skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "should_release=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.4.309.0
        cache: true

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      if: hashFiles('tests/**', 'test/**') != ''
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --no-tests=ignore

    - name: Package release artifact
      if: steps.version.outputs.should_release == 'true'
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.version }}"
        $stagingDir = "vulkan-path-tracer-v$version-windows-x64"
        New-Item -ItemType Directory -Path $stagingDir | Out-Null
        Copy-Item "build/${{ env.BUILD_TYPE }}/vulkan-path-tracer.exe" $stagingDir
        Copy-Item "build/${{ env.BUILD_TYPE }}/SDL3.dll"               $stagingDir
        Compress-Archive -Path "$stagingDir/*" -DestinationPath "$stagingDir.zip"

    - name: Create release
      if: steps.version.outputs.should_release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: v${{ steps.version.outputs.version }}
        files: vulkan-path-tracer-v${{ steps.version.outputs.version }}-windows-x64.zip
        generate_release_notes: true